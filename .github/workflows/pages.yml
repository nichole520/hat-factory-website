name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.134.3'
          extended: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify

      - name: Fix paths for GitHub Pages project subpath (deduplicate prefix)
        run: |
          # 防止Hugo某些版本或插件对硬编码路径漏加前缀：
          # 1) 去重双重前缀
          find public -name "*.html" -type f -exec sed -i 's|/hat-factory-website/hat-factory-website/|/hat-factory-website/|g' {} +
          # 2) 漏掉前缀的（href="/但不是/hat-factory-website/也不是http）→补前缀
          find public -name "*.html" -type f -exec sed -i 's|href="\(/[^h][^"]*\)|href="/hat-factory-website\1|g; s|href="\(/hat-factory-website\)\(/hat-factory-website\)|href="\1|g; s|src="\(/[^h][^"]*\)|src="/hat-factory-website\1|g; s|src="\(/hat-factory-website\)\(/hat-factory-website\)|src="\1|g' {} +
          # CSS url()里补前缀
          find public -name "*.css" -type f -exec sed -i 's|url(\(/[^h][^)]*\)|url(/hat-factory-website\1|g' {} + || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
