{{ define "main" }}
<section class="page-header">
  <div class="container">
    <h1>Contact Us</h1>
  </div>
</section>

<section class="contact-section">
  <div class="container contact-grid">
    <div class="contact-info">
      <h3>Contact Information</h3>
      <p><span class="icon">T</span> Mobile: 0086-12345678901</p>
      <p><span class="icon">E</span> Email: sales@hatfactory.com</p>
      <p><span class="icon">A</span> Address: Room 301, Building 6, Industry Road, District, City, China.</p>
      <p><span class="icon">W</span> Website: www.hatfactory.com</p>
    </div>
    <div class="contact-form">
      <h3>Send Inquiry</h3>
      <form onsubmit="event.preventDefault(); alert('Message sent!');">
        <div class="form-group">
          <label>Name</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Subject</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea required></textarea>
        </div>
        <button type="submit" class="btn-submit">Submit</button>
      </form>
    </div>
  </div>
</section>
{{ end }}
