<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <style>
    .loading-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { margin-top: 16px; color: #666; font-size: 14px; }
    .logout-btn {
      position: fixed; top: 10px; right: 10px;
      padding: 8px 16px; background: #ff6b6b; color: white;
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 13px; z-index: 9999;
    }
    .logout-btn:hover { background: #ff5252; }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载后台管理系统...</div>
  </div>
  <button class="logout-btn" onclick="logout()" style="display:none;" id="logoutBtn">退出登录</button>

  <script>
    // 退出登录
    function logout() {
      if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('decap-github-token');
        localStorage.removeItem('decap-github-username');
        location.href = '/admin/';
      }
    }

    const token = localStorage.getItem('decap-github-token');
    const username = localStorage.getItem('decap-github-username');

    if (!token) {
      location.href = '/admin/';
    } else {
      // ======== 关键：劫持 fetch，自动给 GitHub API 请求加 Token ========
      const originalFetch = window.fetch.bind(window);
      window.fetch = function(url, options = {}) {
        const urlStr = typeof url === 'string' ? url : url.url;
        // 如果是 GitHub API 请求，添加 Authorization header
        if (urlStr && urlStr.includes('api.github.com')) {
          options.headers = options.headers || {};
          if (options.headers instanceof Headers) {
            options.headers.set('Authorization', 'token ' + token);
            options.headers.set('Accept', 'application/vnd.github.v3+json');
          } else {
            options.headers['Authorization'] = 'token ' + token;
            options.headers['Accept'] = 'application/vnd.github.v3+json';
          }
        }
        return originalFetch(url, options);
      };

      // ======== 同时劫持 XMLHttpRequest ========
      const originalXHROpen = XMLHttpRequest.prototype.open;
      const originalXHRSend = XMLHttpRequest.prototype.send;
      
      XMLHttpRequest.prototype.open = function(method, url, ...args) {
        this._githubUrl = typeof url === 'string' && url.includes('api.github.com');
        return originalXHROpen.call(this, method, url, ...args);
      };
      
      XMLHttpRequest.prototype.send = function(body) {
        if (this._githubUrl) {
          this.setRequestHeader('Authorization', 'token ' + token);
          this.setRequestHeader('Accept', 'application/vnd.github.v3+json');
        }
        return originalXHRSend.call(this, body);
      };

      // ======== 设置 Decap CMS 需要的 localStorage 认证信息 ========
      // 尝试多种可能的 key 名
      const authPayload = JSON.stringify({
        token: token,
        user: { login: username },
        access_token: token,
        created_at: Date.now()
      });
      localStorage.setItem('decap-cms-github-auth', authPayload);
      localStorage.setItem('githubAuth', authPayload);
      localStorage.setItem('decapCmsAuth', authPayload);
      localStorage.setItem('decap-cms-auth', authPayload);

      // ======== 加载 Decap CMS ========
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      script.onload = function() {
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'block';
      };
      script.onerror = function() {
        document.querySelector('.loading-text').textContent = '❌ 加载失败，请刷新页面重试';
      };
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
