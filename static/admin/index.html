<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 400px;
    }
    .login-container h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }
    .login-container .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .login-btn:hover {
      transform: translateY(-2px);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .loading {
      text-align: center;
      color: #888;
      margin-top: 20px;
      display: none;
    }
    .token-hint {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    .token-hint a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>🛠️ 网站后台管理</h1>
    <p class="subtitle">用 GitHub 账号登录</p>
    
    <div class="token-hint">
      💡 <strong>没有 Token？</strong> 
      <br>
      打开 <a href="https://github.com/settings/tokens/new" target="_blank">https://github.com/settings/tokens/new</a>
      <br>
      勾选 <code>repo</code> 权限，生成后复制 Token
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">GitHub 用户名</label>
        <input type="text" id="username" placeholder="例如: nichole520" required />
      </div>
      
      <div class="form-group">
        <label for="token">Personal Access Token</label>
        <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxx" required />
      </div>
      
      <button type="submit" class="login-btn" id="loginBtn">登录</button>
    </form>
    
    <div class="error" id="error"></div>
    <div class="loading" id="loading">验证中...</div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const token = document.getElementById('token').value.trim();
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.getElementById('loading');
      const loginBtn = document.getElementById('loginBtn');
      
      errorDiv.style.display = 'none';
      loginBtn.disabled = true;
      loadingDiv.style.display = 'block';
      
      try {
        // 验证 Token 是否有效
        const response = await fetch('https://api.github.com/user', {
          headers: {
            'Authorization': 'token ' + token,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!response.ok) {
          throw new Error('Token 无效，请检查后重试');
        }
        
        const userData = await response.json();
        
        if (userData.login !== username) {
          throw new Error('用户名与 Token 不匹配');
        }
        
        // 保存 Token 到 localStorage（Decap CMS 会读取）
        localStorage.setItem('decap-github-token', token);
        localStorage.setItem('decap-github-username', username);
        
        // 跳转到 CMS 主页面（使用相对路径适配 GitHub Pages 子目录）
        window.location.href = 'cms.html';
        
      } catch (error) {
        errorDiv.textContent = '❌ ' + error.message;
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loadingDiv.style.display = 'none';
      }
    });
  </script>
</body>
</html>
